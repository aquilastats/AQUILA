<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQUILA | Football Intelligence &amp; Scouting</title>
<style>
:root{--bg:#0a1628;--bg2:#101f3a;--cream:#f3ecd9;--line:#2b3f66;--mute:#a9b6cf;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#14284a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--cream);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:40px 22px 36px;text-align:center}
.logo{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 2px #5b6f95,0 10px 40px rgba(0,0,0,.5)}
.word{display:block;width:min(260px,70%);height:auto;margin:22px auto 0}
h1{margin:18px 0 0;font-size:.82rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase}
.tags{margin:12px auto 0;max-width:380px;font-size:.88rem;line-height:1.6;color:var(--mute);letter-spacing:.04em}
hr{width:150px;border:0;border-top:1px solid #3a5586;margin:26px auto}
nav{display:flex;flex-direction:column;gap:14px}
.lk{display:flex;align-items:center;gap:18px;padding:14px 22px;border:1.5px solid var(--line);border-radius:999px;background:linear-gradient(180deg,#0e1d36,#0a1730);color:var(--cream);text-decoration:none;font-weight:600;font-size:1.05rem;transition:transform .15s,border-color .15s,background .15s}
.lk:hover{border-color:#6f86b5;background:#13264a;transform:translateY(-2px)}
.lk:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.ico{width:38px;height:38px;flex:none;display:block}
.ico svg{width:100%;height:100%;display:block}
.nm{flex:1;text-align:left}
.ar{width:22px;height:22px;flex:none;opacity:.85}
footer{margin-top:34px;font-size:.78rem;letter-spacing:.22em;line-height:2;text-transform:uppercase;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.lk{transition:none}}
